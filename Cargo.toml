[package]
name = "ff3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "FF3 and FF3-1 format-preserving encryption"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/ff3"
repository = "https://github.com/benjdod/ff3"

[lib]
name = "ff3"
path = "src/lib.rs"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
cipher = "0.4"
zeroize = "1"

[[bench]]
name = "throughput"
harness = false
